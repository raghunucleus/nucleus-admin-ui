<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nucleus-admin-ui</title>
    <script>
      // Apply the saved theme before first paint so the boot splash and the app
      // render in the correct theme on refresh (no flash of light).
      // Mirrors ThemeProvider: storageKey "nucleus-admin-theme", default "system".
      (function () {
        try {
          var t = localStorage.getItem('nucleus-admin-theme');
          if (
            t === 'dark' ||
            ((!t || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the light splash. */
        }
      })();
    </script>
    <style>
      /* Splash loader — shows immediately on browser refresh until React mounts. */
      .nucleus-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .nucleus-splash__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .nucleus-splash__logo {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
        display: grid;
        place-items: center;
        color: white;
        box-shadow: 0 18px 48px -12px rgba(37, 99, 235, 0.45);
        animation: nucleus-splash-breathe 1.8s ease-in-out infinite;
      }
      .nucleus-splash__logo::before,
      .nucleus-splash__logo::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 18px;
        border: 1px solid rgba(37, 99, 235, 0.18);
        animation: nucleus-splash-ripple 1.8s ease-out infinite;
        pointer-events: none;
      }
      .nucleus-splash__logo::after {
        animation-delay: 0.9s;
      }
      .nucleus-splash__logo svg {
        width: 30px;
        height: 30px;
      }
      .nucleus-splash__title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #1e293b;
      }
      .nucleus-splash__hint {
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .nucleus-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .nucleus-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #2563eb 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: nucleus-splash-sweep 1.4s linear infinite;
      }
      @keyframes nucleus-splash-breathe {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 18px 48px -12px rgba(37, 99, 235, 0.45);
        }
        50% {
          transform: scale(1.06);
          box-shadow: 0 22px 56px -10px rgba(37, 99, 235, 0.6);
        }
      }
      @keyframes nucleus-splash-ripple {
        0% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }
      @keyframes nucleus-splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(180%); }
      }
      /* Dark splash — mirrors the .dark tokens in src/index.css so the boot
         loader matches the app theme (colors must be inlined; CSS not loaded). */
      .dark .nucleus-splash {
        background: #202124;
      }
      .dark .nucleus-splash__title {
        color: #f1f5f9;
      }
      .dark .nucleus-splash__hint {
        color: #94a3b8;
      }
      .dark .nucleus-splash__bar {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nucleus-splash" aria-hidden="true">
        <div class="nucleus-splash__card">
          <div class="nucleus-splash__logo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
              <path d="M20 3v4" />
              <path d="M22 5h-4" />
              <path d="M4 17v2" />
              <path d="M5 18H3" />
            </svg>
          </div>
          <div class="nucleus-splash__title">Nucleus Admin</div>
          <div class="nucleus-splash__bar"></div>
          <div class="nucleus-splash__hint">Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
