<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand assets are generated by nucleus-server/scripts/brand — do not hand-edit public/*.
         `?v=` busts caches of the old favicon that shared these file names. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202124" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nucleus Admin — the administration console of the Nucleus campus platform." />
    <title>Nucleus Admin</title>
    <script>
      // Apply the saved theme before first paint so the boot splash and the app
      // render in the correct theme on refresh (no flash of light).
      // Mirrors ThemeProvider: storageKey "nucleus-admin-theme", default "system".
      (function () {
        try {
          var t = localStorage.getItem('nucleus-admin-theme');
          if (
            t === 'dark' ||
            ((!t || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the light splash. */
        }
      })();
    </script>
    <style>
      /* Splash loader — shows immediately on browser refresh until React mounts. */
      .nucleus-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .nucleus-splash__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      /* The logo mark, animated: rings and core hold still while the electrons
         revolve around the nucleus (three on the outer ring, one faster on the
         inner ring). Same geometry/keyframes as <NucleusLoader> in
         src/components/brand; colours mirror --nucleus-* in src/index.css. */
      .nucleus-splash__logo {
        width: 72px;
        height: 72px;
        --nucleus-p1: #3e0db5;
        --nucleus-p2: #7a35d0;
        --nucleus-o1: #ff9e08;
        --nucleus-o2: #ff8a1c;
        --nucleus-c1: #8b47d3;
        --nucleus-c2: #4b249b;
        --nucleus-c3: #1a1560;
      }
      .nucleus-splash__logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* fill-box + the invisible full-canvas rect inside each orbit group put
         the pivot on the nucleus (view-box would pivot on the viewport corner). */
      .nucleus-splash__logo [data-part^="orbit"] {
        transform-box: fill-box;
        transform-origin: center;
      }
      .nucleus-splash__logo [data-part="orbit-outer"] {
        animation: nucleus-orbit 4s linear infinite;
      }
      .nucleus-splash__logo [data-part="orbit-inner"] {
        animation: nucleus-orbit 1.8s linear infinite reverse;
      }
      .nucleus-splash__title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #1e293b;
      }
      .nucleus-splash__hint {
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .nucleus-splash__bar {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .nucleus-splash__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #2563eb 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: nucleus-splash-sweep 1.4s linear infinite;
      }
      @keyframes nucleus-orbit {
        to { transform: rotate(360deg); }
      }
      @keyframes nucleus-splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(180%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nucleus-splash__logo [data-part^="orbit"],
        .nucleus-splash__bar::after {
          animation: none;
        }
      }
      /* Dark splash — mirrors the .dark tokens in src/index.css so the boot
         loader matches the app theme (colors must be inlined; CSS not loaded). */
      .dark .nucleus-splash {
        background: #202124;
      }
      .dark .nucleus-splash__logo {
        --nucleus-p1: #7b58f5;
        --nucleus-p2: #a98cff;
        --nucleus-o1: #ffa826;
        --nucleus-o2: #ff8f2e;
        --nucleus-c1: #c9b0ff;
        --nucleus-c2: #7b58f5;
        --nucleus-c3: #3a2190;
      }
      .dark .nucleus-splash__title {
        color: #f1f5f9;
      }
      .dark .nucleus-splash__hint {
        color: #94a3b8;
      }
      .dark .nucleus-splash__bar {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>

          <div class="nucleus-splash__logo">

          </div>
          <div class="nucleus-splash__title">Nucleus Admin</div>
          <div class="nucleus-splash__bar"></div>
          <div class="nucleus-splash__hint">Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
